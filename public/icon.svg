<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded rectangle -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="#334155" stroke-width="2" opacity="0.6" />

  <!-- Central Emblem: Crescent, Book of Knowledge & Star -->
  <g transform="translate(256, 230)">
    <!-- Spiritual Crescent -->
    <path d="M 0 -130 A 130 130 0 0 0 -95 90 A 115 115 0 0 1 -15 -95 A 130 130 0 0 0 0 -130 Z" fill="url(#emeraldGrad)" />

    <!-- Open Book of Knowledge -->
    <!-- Left Page -->
    <path d="M -10 30 C -50 20, -110 35, -135 60 L -135 -30 C -110 -55, -50 -40, -10 -30 Z" fill="#F8FAFC" opacity="0.95" />
    <path d="M -20 20 C -55 12, -100 25, -120 45 L -120 -15 C -100 -35, -55 -22, -20 -15 Z" fill="#E2E8F0" opacity="0.5" />

    <!-- Right Page -->
    <path d="M 10 30 C 50 20, 110 35, 135 60 L 135 -30 C 110 -55, 50 -40, 10 -30 Z" fill="#F8FAFC" opacity="0.95" />
    <path d="M 20 20 C 55 12, 100 25, 120 45 L 120 -15 C 100 -35, 55 -22, 20 -15 Z" fill="#E2E8F0" opacity="0.5" />

    <!-- Book Spine & Bookmark -->
    <path d="M -6 40 L 0 45 L 6 40 L 6 -40 L -6 -40 Z" fill="url(#goldGrad)" />
    <path d="M -4 45 L 0 75 L 4 45 Z" fill="url(#goldGrad)" />

    <!-- Guiding Star / Excellence Beacon -->
    <polygon points="0,-75 14,-35 55,-35 22,-10 35,30 0,6 -35,30 -22,-10 -55,-35 -14,-35" fill="url(#goldGrad)" transform="translate(65, -60) scale(0.4)" filter="url(#subtleGlow)" />
  </g>

  <!-- Arabic Calligraphy / Name "احرص" -->
  <text x="256" y="420" font-family="'Cairo', 'Tajawal', system-ui, -apple-system, sans-serif" font-size="64" font-weight="900" fill="#F8FAFC" text-anchor="middle" letter-spacing="2">
    احْرِصْ
  </text>
  <text x="256" y="455" font-family="'Cairo', 'Tajawal', system-ui, -apple-system, sans-serif" font-size="19" font-weight="600" fill="#10B981" text-anchor="middle" letter-spacing="1">
    تَفَوُّقٌ وَالْتِزَامٌ
  </text>
</svg>
